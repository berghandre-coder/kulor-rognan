<!DOCTYPE html>
<html class="scroll-smooth" lang="no">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kategori (demo) - Kulør Rognan</title>
<meta content="noindex, nofollow" name="robots"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&family=Manrope:wght@400;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #f5ece5; }
    ::-webkit-scrollbar-thumb { background: #8b5000; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #6a3c00; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
<script src="../assets/tailwind-config.js"></script>
</head>
<body class="bg-surface-cream text-on-surface font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<script src="../assets/store-config.js"></script>
<script src="../assets/layout.js"></script>
<script>KulorLayout.injectDemoBanner();</script>
<script>
  var params = new URLSearchParams(location.search);
  var typeKey = params.get("type") || "inne";
  KulorLayout.injectHeader("../", "nettbutikk", true);
  KulorLayout.injectStoreNav("../", typeKey);
</script>

<main>
  <section class="w-full bg-surface-container border-b border-outline-variant/20 py-10">
    <div class="max-w-7xl mx-auto px-margin-mobile md:px-margin-desktop">
      <nav class="text-sm text-on-surface-variant mb-3" aria-label="Brødsmulesti">
        <a class="hover:text-primary" href="index.html">Nettbutikk</a> <span class="mx-1">/</span> <span id="crumb-title" class="text-deep-forest font-semibold"></span>
      </nav>
      <h1 id="category-title" class="font-headline-lg text-headline-lg text-deep-forest mb-2"></h1>
      <p id="category-intro" class="text-on-surface-variant max-w-2xl"></p>
    </div>
  </section>

  <section class="w-full py-10">
    <div class="max-w-7xl mx-auto px-margin-mobile md:px-margin-desktop">
      <div id="subcategory-chips" class="flex flex-wrap gap-2 mb-10"></div>
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <p id="empty-state" class="hidden text-center text-on-surface-variant py-16">Ingen produkter i denne underkategorien ennå &ndash; kontakt oss, så hjelper vi deg.</p>
    </div>
  </section>
</main>

<script>KulorLayout.injectFooter("../");</script>
<script src="data.js"></script>
<script>
  var meta = CATEGORY_META[typeKey] || CATEGORY_META.inne;
  document.getElementById("category-title").textContent = meta.title;
  document.getElementById("crumb-title").textContent = meta.title;
  document.getElementById("category-intro").textContent = meta.intro;
  document.title = meta.title + " (demo) - Kulør Rognan";

  var activeSub = "Alle";
  var chipsWrap = document.getElementById("subcategory-chips");
  var gridWrap = document.getElementById("product-grid");
  var emptyState = document.getElementById("empty-state");

  function chipClasses(isActive) {
    return isActive
      ? "bg-vibrant-orange text-white border-vibrant-orange"
      : "bg-white text-deep-forest border-outline-variant/40 hover:border-vibrant-orange/60";
  }

  function renderChips() {
    var subs = ["Alle"].concat(meta.subcategories);
    chipsWrap.innerHTML = subs.map(function (s) {
      return '<button type="button" data-sub="' + s + '" class="px-4 py-2 rounded-full border text-sm font-semibold transition-colors ' + chipClasses(s === activeSub) + '">' + s + '</button>';
    }).join("");
    chipsWrap.querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeSub = btn.getAttribute("data-sub");
        renderChips();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    var list = PRODUCTS.filter(function (p) { return p.category === typeKey; });
    if (activeSub !== "Alle") {
      list = list.filter(function (p) { return p.subcategory === activeSub; });
    }
    gridWrap.innerHTML = list.map(productCardHTML).join("");
    emptyState.classList.toggle("hidden", list.length > 0);
  }

  renderChips();
  renderGrid();
</script>
</body>
</html>
